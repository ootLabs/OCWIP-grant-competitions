services:
  db:
    image: postgres:16-alpine
    container_name: ocwip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocwip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocwip}
      POSTGRES_DB: ${POSTGRES_DB:-ocwip}
      # Polish collation, because operators sort applicants by name.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on an empty data volume (first start).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocwip} -d ${POSTGRES_DB:-ocwip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ocwip-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: ${DATABASE_URL:-Host=db;Port=5432;Database=ocwip;Username=ocwip;Password=ocwip}
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:3000}
      # Verification and password reset links are built from this (T-91).
      EmailVerification__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
      # Host header filter. "*" is for the local stack only; Production
      # refuses to start with it (T-91).
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      Auth__SessionLifetimeHours: ${AUTH_SESSION_LIFETIME_HOURS:-8}
      # The ceiling on one session, counted from the sign in (S-17).
      Auth__SessionAbsoluteHours: ${AUTH_SESSION_ABSOLUTE_HOURS:-24}
      Auth__CookieSameSite: ${AUTH_COOKIE_SAME_SITE:-Lax}
      # Empty on purpose, like Auth__SecureCookie below: only a deployment
      # that really splits the front and the API across two sites says true
      # here, and Production refuses to start on SameSite=None without it.
      Auth__AllowCrossSiteCookie: ${AUTH_ALLOW_CROSS_SITE_COOKIE:-}
      # Empty on purpose, NOT false. An explicit false here would override the
      # code's own default (Secure everywhere except Development) for every
      # deployment using this file, including one that sets
      # ASPNETCORE_ENVIRONMENT=Production above. Empty reads back as unset.
      Auth__SecureCookie: ${AUTH_SECURE_COOKIE:-}
      Auth__MaxFailedLoginAttempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:-5}
      Auth__LockoutMinutes: ${AUTH_LOCKOUT_MINUTES:-15}
      RateLimiting__PermitLimit: ${RATE_LIMIT_PERMIT_LIMIT:-10}
      RateLimiting__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      # Cloudflare's published test secret: every token from the test site
      # key passes, and the check still runs the whole way to Cloudflare.
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      Attachments__StoragePath: ${ATTACHMENTS_STORAGE_PATH:-/data/attachments}
      # Reminders and deadlines in the background (T-105).
      BackgroundJobs__Enabled: ${BACKGROUND_JOBS_ENABLED:-true}
      BackgroundJobs__IntervalSeconds: ${BACKGROUND_JOBS_INTERVAL_SECONDS:-60}
      # DataProtection key ring on a volume (T-113), so a rebuilt container
      # keeps everybody signed in and the links in account mail valid.
      DataProtection__KeysPath: ${DATA_PROTECTION_KEYS_PATH:-/data/keys}
      # Mail relay (T-43a), pointed at the Mailpit service below, so account
      # mail lands in a mailbox a person can open instead of in the log.
      #
      # DEV_SMTP_* and not SMTP_*: this file is the only one reading the dev
      # template .env, and an .env copied from .env.example before this change
      # carries SMTP_PORT=587 with SMTP_ENABLE_SSL=true. Those would override
      # the defaults below and the backend would try STARTTLS against
      # Mailpit's plain 1025, losing every mail with nothing in the log.
      # SMTP_* stays the name in the production, staging and backup-test files.
      #
      # One dash, not ":-": an explicit empty DEV_SMTP_HOST= stays empty and
      # brings back the log-only mode (EmailSenderService). With ":-" an empty
      # value would read back as "mailpit" and the mode would be unreachable.
      Smtp__Host: ${DEV_SMTP_HOST-mailpit}
      Smtp__Port: ${DEV_SMTP_PORT:-1025}
      Smtp__EnableSsl: ${DEV_SMTP_ENABLE_SSL:-false}
      Smtp__User: ${DEV_SMTP_USER:-}
      Smtp__Password: ${DEV_SMTP_PASSWORD:-}
      # Required once a host is set, so it has a default a local stack can use.
      Smtp__From: ${DEV_SMTP_FROM:-konkursy@ocwip.local}
      Smtp__FromName: ${DEV_SMTP_FROM_NAME:-OCWIP}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # Required for dotnet watch to see edits on a bind mount.
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/src
      # Keep build output inside the container; host bin/obj would poison it.
      - backend-obj:/src/src/Ocwip.Api/obj
      - backend-bin:/src/src/Ocwip.Api/bin
      # Uploaded application attachments (T-32), kept out of the bind mount so
      # they survive independently of the source tree.
      - attachments-data:/data/attachments
      - dataprotection-keys:/data/keys
    depends_on:
      db:
        condition: service_healthy
      # Started, not healthy: the mailbox has no healthcheck, and the first
      # mail is sent long after the stack is up anyway.
      mailpit:
        condition: service_started
    command: dotnet watch run --project src/Ocwip.Api/Ocwip.Api.csproj --no-launch-profile

  frontend:
    build:
      context: ./frontend
    container_name: ocwip-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Read on the Next.js server, inside this container, so the host is the
      # compose service name and not the address the browser uses (T-23).
      API_SERVER_URL: ${API_SERVER_URL:-http://backend:8080}
      # Read at request time by the account pages; Cloudflare's test key,
      # whose widget always passes.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      # Read by npm run api:generate, which runs inside this container, so the
      # host is the compose service name and not localhost.
      OPENAPI_URL: ${OPENAPI_URL:-http://backend:8080/openapi/v1.json}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules; do not let the host mount shadow it.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # The development mailbox, and the one the browser test reads (T-100).
  # Part of the plain stack, with no profile: the backend above sends here by
  # default, so verification, password reset and the background reminders are
  # all readable at http://localhost:8025 instead of being dug out of the log.
  # Messages live in memory only, so restarting this container empties it.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ocwip-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      # SMTP for a sender outside the stack, such as scripts/monitor.py (T-116).
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres-data:
  dataprotection-keys:
  backend-obj:
  backend-bin:
  attachments-data:
