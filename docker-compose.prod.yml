# Production on one machine (T-111): Caddy in front, everything else on an
# internal network with no port on the host. No bind mounts; data on named
# volumes. Every secret is required: a missing one stops "docker compose up"
# with its name instead of starting a half configured system.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# docs/wdrozenie.md has the first start, updates and rolling back.
#
# Built here by default; a server deploying from GHCR (T-115) sets
# IMAGE_REGISTRY=ghcr.io/ootlabs/ and IMAGE_TAG=<commit> and runs "pull".
#
# IMAGE_DIGEST_<SERVICE>=@sha256:<digest> pins that image to the one CI built
# for the commit (S-39). A tag in a registry can be moved to another image, a
# digest cannot, and scripts/deploy.sh passes the digests it was given for the
# commit it is starting. Empty here, so a build in place keeps working.
name: ocwip-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# S-13: the same floor under every container. The whole machine is two cores
# and 4 GB (docs/wdrozenie.md, "Staging"), so one runaway request, one broken
# query or one zip bomb must not take the host and the database with it. Each
# service then adds its own ceiling and only the capabilities it cannot work
# without: the limits are the part an operator reads, the capabilities the
# part an attacker meets.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 512

# read_only on top of that, for the four services that keep nothing of their
# own inside the container: everything they must survive on is a volume, or
# they exit. Then nothing an attacker drops in outlives a restart, and the
# paths the runtime does write are named here instead of being whatever the
# image happened to leave writable. db, backup and restore are the three
# exceptions and each says why below; ci.yml holds that same list, so an
# eighth service cannot join this file without the decision being made.
x-ephemeral: &ephemeral
  read_only: true
  # The runtime's own scratch, which it expects to exist whatever we mount:
  # .NET opens its diagnostic socket there, and ASP.NET buffers a large
  # upload to a file there before it reaches the attachment volume. A tmpfs
  # is memory, so what lands here counts against mem_limit below, which is
  # why it gets a size of its own: without one the kernel gives it half of
  # the host's memory, above every ceiling in this file, and a container
  # would be killed by its own scratch instead of answering an error.
  tmpfs: ["/tmp:size=128m"]

services:
  db:
    build:
      context: .
      dockerfile: deploy/db/Dockerfile
    image: ${IMAGE_REGISTRY:-}ocwip-db:${IMAGE_TAG:-prod}${IMAGE_DIGEST_DB:-}
    # No read_only here. The one directory an attacker wants to write is
    # PGDATA, and that is a volume, so it has to stay writable either way.
    # Buying the rest would cost a tmpfs over the socket directory owned by
    # the base image's postgres UID, written in here by number: fragile at
    # the next image bump for the sake of the container layer alone.
    <<: *hardening
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocwip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?the database owner password}
      POSTGRES_DB: ocwip
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
      OCWIP_MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?the password of ocwip_migrator}
      OCWIP_APP_PASSWORD: ${APP_PASSWORD:?the password of ocwip_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the socket: while initdb bootstraps an empty volume a
      # temporary server answers on the socket only, and migrate (which has
      # no second try) would connect before the real one listens.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ocwip -d ocwip"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [internal]

  # Runs the migrations as ocwip_migrator and exits; the API waits for it.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: migrate
    image: ${IMAGE_REGISTRY:-}ocwip-migrate:${IMAGE_TAG:-prod}${IMAGE_DIGEST_MIGRATE:-}
    <<: [*hardening, *ephemeral]
    # The one tmpfs here that may not be noexec, which is what the runtime
    # mounts a tmpfs as unless told otherwise: the bundle unpacks itself and
    # then maps what it unpacked with execute permission, so a noexec
    # directory fails it a second time, after the write already succeeded.
    # One short lived container, as a user without root, every capability
    # dropped, so this is the cheapest place in the file to allow it.
    tmpfs: ["/tmp:exec,size=128m"]
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=ocwip;Username=ocwip_migrator;Password=${MIGRATOR_PASSWORD:?}
      # The bundle is a single file executable and unpacks itself before it
      # runs, by default into the home directory of its user, which read_only
      # above makes unwritable: without this the migrations exit 159 and the
      # API never starts.
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: runtime
    image: ${IMAGE_REGISTRY:-}ocwip-backend:${IMAGE_TAG:-prod}${IMAGE_DIGEST_BACKEND:-}
    <<: [*hardening, *ephemeral]
    # More room than the shared floor, because this is the one service that
    # buffers uploads here: 26 MB a request (the Kestrel limit), so ten at
    # once fit, which is already the rate limit. A quarter of the ceiling
    # below, so a burst of uploads cannot reach it and get the API killed.
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=ocwip;Username=ocwip_app;Password=${APP_PASSWORD:?}
      # The public address, and "backend" for the frontend's own server,
      # which calls the API inside the network by that name.
      AllowedHosts: ${DOMAIN:?the public host name, for example konkursy.ocwip.pl};backend
      Cors__Origins: https://${DOMAIN:?}
      EmailVerification__FrontendBaseUrl: https://${DOMAIN:?}
      # Two versions, so a rotation needs no edit here (docs/wdrozenie.md,
      # "Rotacja klucza"). Neither is required by compose: the API itself
      # refuses to start in Production without any key.
      FieldEncryption__Keys__1: ${FIELD_ENCRYPTION_KEY:-}
      FieldEncryption__Keys__2: ${FIELD_ENCRYPTION_KEY_2:-}
      Smtp__Host: ${SMTP_HOST:?the mail relay}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:?the sender address}
      Smtp__FromName: ${SMTP_FROM_NAME:-OCWIP}
      # Only Caddy, at its fixed address, may name the client's address:
      # not the rest of the internal network (frontend, backup, Mailpit).
      ForwardedHeaders__KnownProxies: 172.30.0.200
      RateLimiting__PermitLimit: ${RATE_LIMIT_PERMIT_LIMIT:-10}
      RateLimiting__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:?the Turnstile secret key}
    volumes:
      - attachments-data:/data/attachments
      - dataprotection-keys:/data/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The runtime image has no curl; bash speaks HTTP well enough for this.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: backend\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Built into the browser code. Relative (T-115): the browser calls
        # its own origin, Caddy sends /api on, and one image fits every
        # domain; the frontend's own server uses API_SERVER_URL instead.
        NEXT_PUBLIC_API_URL: /api
    image: ${IMAGE_REGISTRY:-}ocwip-frontend:${IMAGE_TAG:-prod}${IMAGE_DIGEST_FRONTEND:-}
    <<: [*hardening, *ephemeral]
    # Next writes the cache of its own fetches and of optimized images while
    # it serves, so this one is not optional: without it the first render of
    # a server side page answers 500.
    tmpfs: ["/tmp:size=128m", "/app/.next/cache:size=128m"]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    environment:
      API_SERVER_URL: http://backend:8080
      # The public half of the Turnstile pair, read per request, so the
      # image stays the same for every domain.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?the Turnstile site key}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [internal]

  caddy:
    build: deploy/caddy
    image: ${IMAGE_REGISTRY:-}ocwip-caddy:${IMAGE_TAG:-prod}${IMAGE_DIGEST_CADDY:-}
    <<: [*hardening, *ephemeral]
    mem_limit: 256m
    cpus: 0.5
    # The only service with a port on the host, so the only one that
    # needs to bind 80 and 443 inside the container.
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
      CADDY_TLS: ${CADDY_TLS:?an e-mail address for Let's Encrypt, or internal on a test machine}
    # The only ports on the host. HTTP_PORT and HTTPS_PORT exist for a
    # machine that may not bind below 1024 (rootless containers).
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      internal:
        # Outside ip_range below, so no other container can be given it.
        ipv4_address: 172.30.0.200

  # Nightly backups (T-114) into a restic repository off the server.
  backup:
    build: deploy/backup
    image: ${IMAGE_REGISTRY:-}ocwip-backup:${IMAGE_TAG:-prod}${IMAGE_DIGEST_BACKUP:-}
    <<: *hardening
    mem_limit: 512m
    cpus: 1.0
    # No read_only here either: pg_dump writes the dump to /backup and that
    # needs real disk. A tmpfs would count against mem_limit above, which
    # means a ceiling on the size of database that can still be backed up,
    # found at two in the morning. The rest of this container's hygiene is
    # S-25 in docs/przeglad-bezpieczenstwa.md.
    # Root reading files of other users from the read only volumes: the
    # DataProtection key ring is not world readable, and root without this
    # capability is just another user that may not read it.
    # SETGID because this is the one container whose work is started by
    # cron: busybox crond calls initgroups before every job, which needs it,
    # and without it the job dies with "can't set groups" before backup.sh
    # is reached. crond stays alive and says nothing, so the container looks
    # healthy and the nightly copy quietly stops happening. Neither CI nor
    # deploy.sh would notice: both call backup.sh through "compose exec".
    cap_add: [DAC_READ_SEARCH, SETGID]
    restart: unless-stopped
    environment: &backup-environment
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?the restic repository, for example s3:https://... or sftp:...}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?the restic password, kept outside the server as well}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      TZ: Europe/Warsaw
    volumes:
      - attachments-data:/data/attachments:ro
      - dataprotection-keys:/data/keys:ro
      - backup-cache:/root/.cache/restic
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    networks: [internal]

  # scripts/restore.sh only: the same image, writing into the empty volumes.
  restore:
    profiles: ["restore"]
    build: deploy/backup
    image: ${IMAGE_REGISTRY:-}ocwip-backup:${IMAGE_TAG:-prod}${IMAGE_DIGEST_BACKUP:-}
    <<: *hardening
    mem_limit: 512m
    cpus: 1.0
    # Writes into the volumes it restores, so not read_only (see backup).
    # Writing the files back where they were, with the owner they had.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    entrypoint: ["/usr/local/bin/restore-files.sh"]
    environment:
      <<: *backup-environment
      RESTORE_SNAPSHOT: ${RESTORE_SNAPSHOT:-latest}
    volumes:
      - attachments-data:/data/attachments
      - dataprotection-keys:/data/keys
      - backup-cache:/root/.cache/restic
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Addresses handed out to containers; .128 and up are fixed ones.
          ip_range: 172.30.0.0/25

volumes:
  postgres-data:
  attachments-data:
  dataprotection-keys:
  caddy-data:
  caddy-config:
  backup-cache:
