name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_map.py
      - run: python scripts/check_text.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ocwip
          POSTGRES_PASSWORD: ocwip
          POSTGRES_DB: ocwip
          # The same locale docker-compose.yml gives the database, because
          # upper() answers by it: a test comparing SQL upper casing against
          # .NET has to run against the collation the developers have.
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocwip -d ocwip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Service containers ignore db/init/, so it is applied by hand here.
      # Moving the bootstrap elsewhere means changing this step.
      - name: Apply database bootstrap
        run: |
          for file in db/init/*.sql; do
            PGPASSWORD=ocwip psql -h localhost -U ocwip -d ocwip -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Apply EF Core migrations
        working-directory: backend
        run: |
          dotnet restore Ocwip.slnx
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet ef database update --project src/Ocwip.Api/Ocwip.Api.csproj
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=ocwip;Username=ocwip;Password=ocwip
      # The listing exits 0 even when it finds something, so the count of
      # high and critical findings is what fails the job (T-90).
      - name: Audit NuGet packages
        working-directory: backend
        run: |
          dotnet list Ocwip.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vulnerable.json"
          found=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? | select(.severity == "High" or .severity == "Critical")] | length' "$RUNNER_TEMP/vulnerable.json")
          if [ "$found" != "0" ]; then
            dotnet list Ocwip.slnx package --vulnerable --include-transitive
            exit 1
          fi
      - run: dotnet test backend/Ocwip.slnx --logger "console;verbosity=normal"
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=ocwip;Username=ocwip;Password=ocwip
          # Read by PermissionSuiteCiGuardTests, which refuses a run where the
          # permission suite would report Skipped. Set here rather than relied
          # on as a runner default, because a job moved into a container does
          # not inherit it and the guard would then never bite.
          CI: "true"
          # appsettings.json defaults to /data/attachments, which only exists
          # because docker-compose.yml mounts a volume there. This job runs
          # dotnet test directly on the runner, not in that container, and the
          # runner user cannot create a directory at filesystem root (T-32).
          Attachments__StoragePath: ${{ runner.temp }}/attachments

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Runtime dependencies only: a hole in a test tool does not reach the
      # server, and waiting on its fix would block every pull request.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: Smoke test on the full stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: python scripts/smoke_test.py
      # Without this the log says "smoke test failed" and nothing else, and the
      # cause is almost always a container that never came up.
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100

  images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Dockerfile.prod of each side (T-110). The backend one fails its
      # own build when Europe/Warsaw is missing from the image.
      - run: docker build -f backend/Dockerfile.prod -t ocwip-backend:prod backend
      - run: docker build -f frontend/Dockerfile.prod -t ocwip-frontend:prod frontend
      - name: Check who the images run as
        run: |
          test "$(docker run --rm --entrypoint id ocwip-backend:prod -u)" != "0"
          test "$(docker run --rm --entrypoint id ocwip-frontend:prod -un)" = "node"
      # The images on their own, without the development compose file: a
      # network, the database, and both containers under the names the
      # images expect. Staging, not Production, because Production refuses to
      # start without a public address and a mail relay (T-91), which is the
      # production compose file's business (T-111).
      - name: Start the images
        run: |
          docker network create ocwip
          docker run -d --name db --network ocwip \
            -e POSTGRES_USER=ocwip -e POSTGRES_PASSWORD=ocwip -e POSTGRES_DB=ocwip \
            -e POSTGRES_INITDB_ARGS=--locale=C.UTF-8 \
            -v "$PWD/db/init:/docker-entrypoint-initdb.d:ro" postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U ocwip -d ocwip && break; sleep 2; done
          # Restarted if it starts during the database's own first restart
          # after initdb, which pg_isready can answer through.
          docker run -d --name backend --network ocwip -p 8080:8080 --restart on-failure:5 \
            -e ASPNETCORE_ENVIRONMENT=Staging -e Database__MigrateOnStartup=true \
            -e "ConnectionStrings__Postgres=Host=db;Port=5432;Database=ocwip;Username=ocwip;Password=ocwip" \
            ocwip-backend:prod
          docker run -d --name frontend --network ocwip -p 3000:3000 ocwip-frontend:prod
      - run: python scripts/smoke_test.py
      - name: Container logs
        if: failure()
        run: |
          docker logs --tail 100 backend
          docker logs --tail 100 frontend
