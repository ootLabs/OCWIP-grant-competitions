name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Read only by default; a job that needs more says so itself (production
# pushes to GHCR). Actions are pinned to a commit, the tag in the comment.
permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_map.py
      - run: python scripts/check_text.py
      # S-26, S-39: deploy.sh refuses anything but a commit SHA, and pins the
      # images to the digests of the commit it starts.
      - run: python scripts/check_deploy.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ocwip
          POSTGRES_PASSWORD: ocwip
          POSTGRES_DB: ocwip
          # The same locale docker-compose.yml gives the database, because
          # upper() answers by it: a test comparing SQL upper casing against
          # .NET has to run against the collation the developers have.
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocwip -d ocwip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      # Service containers ignore db/init/, so it is applied by hand here.
      # Moving the bootstrap elsewhere means changing this step.
      - name: Apply database bootstrap
        run: |
          for file in db/init/*.sql; do
            PGPASSWORD=ocwip psql -h localhost -U ocwip -d ocwip -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Apply EF Core migrations
        working-directory: backend
        run: |
          dotnet restore Ocwip.slnx
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet ef database update --project src/Ocwip.Api/Ocwip.Api.csproj
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=ocwip;Username=ocwip;Password=ocwip
      # The listing exits 0 even when it finds something, so the count of
      # high and critical findings is what fails the job (T-90).
      - name: Audit NuGet packages
        working-directory: backend
        run: |
          dotnet list Ocwip.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vulnerable.json"
          found=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? | select(.severity == "High" or .severity == "Critical")] | length' "$RUNNER_TEMP/vulnerable.json")
          if [ "$found" != "0" ]; then
            dotnet list Ocwip.slnx package --vulnerable --include-transitive
            exit 1
          fi
      - run: dotnet test backend/Ocwip.slnx --logger "console;verbosity=normal"
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=ocwip;Username=ocwip;Password=ocwip
          # Read by PermissionSuiteCiGuardTests, which refuses a run where the
          # permission suite would report Skipped. Set here rather than relied
          # on as a runner default, because a job moved into a container does
          # not inherit it and the guard would then never bite.
          CI: "true"
          # appsettings.json defaults to /data/attachments, which only exists
          # because docker-compose.yml mounts a volume there. This job runs
          # dotnet test directly on the runner, not in that container, and the
          # runner user cannot create a directory at filesystem root (T-32).
          Attachments__StoragePath: ${{ runner.temp }}/attachments

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Runtime dependencies only: a hole in a test tool does not reach the
      # server, and waiting on its fix would block every pull request.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: Smoke test on the full stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: python scripts/smoke_test.py
      # R-32: the TypeScript client is generated from the backend's OpenAPI
      # document and committed. A contract change without a regenerated
      # client fails here, not in a browser. Development serves /openapi, and
      # the source is bind mounted, so the file lands in this checkout.
      - name: Generated API client matches the backend
        run: |
          docker compose exec -T frontend npm run api:generate
          git diff --exit-code -- frontend/lib/api-schema.ts
      # Without this the log says "smoke test failed" and nothing else, and the
      # cause is almost always a container that never came up.
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100

  # T-100: the whole process in a browser, from registration to a submitted
  # application, on an empty database. Beside the other jobs, not after them.
  e2e:
    name: Browser test of the whole process
    runs-on: ubuntu-latest
    env:
      # Mail goes to Mailpit, part of the plain stack, where the test reads the
      # links. Only the sender is set: host, port and TLS already default to
      # the mailbox in docker-compose.yml.
      DEV_SMTP_FROM: ocwip-e2e@example.org
      # The scenario registers and signs in several people from one address.
      RATE_LIMIT_PERMIT_LIMIT: "200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Wait for the stack
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/health >/dev/null && curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "the stack did not come up"; exit 1
      - run: npx tsc --noEmit
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      # The recording, the trace and the screenshots of a failed run.
      - name: Recording of the run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-recording
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 200

  # T-111: the production compose file as a server runs it, Caddy with its
  # own certificate authority on a test domain, and the smoke test through it.
  production:
    name: Production compose behind Caddy
    runs-on: ubuntu-latest
    # T-115: these images, once scanned and through the smoke test, are the
    # ones pushed to GHCR, tagged with the commit and the branch.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ghcr.io/ootlabs/
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Settings of a test server
        run: |
          cat > .env.prod <<ENV
          DOMAIN=ocwip.test
          CADDY_TLS=internal
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          MIGRATOR_PASSWORD=$(openssl rand -hex 16)
          APP_PASSWORD=$(openssl rand -hex 16)
          FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SMTP_HOST=smtp.invalid
          SMTP_FROM=ocwip@example.org
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          RESTIC_REPOSITORY=/root/.cache/restic/unused
          RESTIC_PASSWORD=$(openssl rand -hex 16)
          ENV
      # S-39: a deployment passes the digests CI recorded for the commit, so
      # no image reference may stay on a movable tag when they are given.
      - name: Every image takes the digest it is given
        run: |
          digest="@sha256:$(printf 'a%.0s' {1..64})"
          rendered=$(IMAGE_DIGEST_DB="$digest" IMAGE_DIGEST_MIGRATE="$digest" IMAGE_DIGEST_BACKEND="$digest" \
            IMAGE_DIGEST_FRONTEND="$digest" IMAGE_DIGEST_CADDY="$digest" IMAGE_DIGEST_BACKUP="$digest" \
            docker compose -f docker-compose.prod.yml --env-file .env.prod --profile restore config)
          # The count first: "no image line is loose" is also true of no image
          # lines at all, so a broken render or a changed output format would
          # pass this check without checking anything. Seven lines, because
          # the restore service of the profile shares the backup image.
          images=$(printf '%s\n' "$rendered" | grep -cE '^[[:space:]]+image:')
          loose=$(printf '%s\n' "$rendered" | grep -E '^[[:space:]]+image:' | grep -vc '@sha256:' || true)
          echo "image lines: $images, of them without a digest: $loose"
          test "$images" = "7"
          test "$loose" = "0"
      # S-13: every container has a ceiling and nothing above the floor it
      # needs. The three writable ones are named here on purpose, so an
      # eighth service cannot be added to the compose file without someone
      # deciding which side of this line it belongs on.
      - name: Every container has its limits
        run: |
          rendered=$(docker compose -f docker-compose.prod.yml --env-file .env.prod --profile restore config --format json)
          # The count first, for the same reason as above: "every service has
          # a limit" is true of no services at all, so a render that broke or
          # changed shape would pass a check that compared nothing.
          test "$(jq '.services | length' <<<"$rendered")" = "7"
          jq -e '
            ["db", "backup", "restore"] as $writable
            | [ .services | to_entries[]
                | .key as $name
                | select(
                    ((.value.mem_limit // 0) | tonumber) == 0
                    or ((.value.cpus // 0) | tonumber) == 0
                    or ((.value.pids_limit // 0) | tonumber) == 0
                    or ((.value.cap_drop // []) | index("ALL")) == null
                    or ((.value.security_opt // []) | index("no-new-privileges:true")) == null
                    or (.value.read_only != true and ($writable | index($name)) == null)
                  )
                | $name ]
            | if length == 0 then "every service has the floor"
              else "without the floor: \(join(", "))" | halt_error(1) end
          ' <<<"$rendered"
      - run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
      - name: Smoke test through Caddy
        env:
          SMOKE_BACKEND_URL: https://ocwip.test/api
          SMOKE_FRONTEND_URL: https://ocwip.test
          SMOKE_RESOLVE: ocwip.test:127.0.0.1
          SMOKE_INSECURE: "1"
          SMOKE_EXPECT_NO_OPENAPI: "1"
        run: python scripts/smoke_test.py
      - name: Only 80 and 443 on the host, HSTS on the answer
        run: |
          published=$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps --format json \
            | jq -r 'if type == "array" then .[] else . end | .Publishers[]? | select(.PublishedPort != 0) | .PublishedPort' \
            | sort -un | tr '\n' ' ')
          echo "published: $published"
          test "$published" = "80 443 "
          curl -skI --resolve ocwip.test:443:127.0.0.1 https://ocwip.test/ | grep -i '^strict-transport-security'
      # T-112: the security headers on both halves, and the public pages run
      # under the production policy (no 'unsafe-eval') without a violation.
      - name: Security headers on the API and the pages
        run: |
          for address in https://ocwip.test/ https://ocwip.test/api/health; do
            headers=$(curl -skI --resolve ocwip.test:443:127.0.0.1 "$address")
            echo "$headers" | grep -i '^content-security-policy:.*frame-ancestors .none.'
            echo "$headers" | grep -i '^x-content-type-options: nosniff'
            echo "$headers" | grep -i '^referrer-policy: no-referrer'
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Public pages under the policy
        working-directory: e2e
        env:
          E2E_BASE_URL: https://ocwip.test
          E2E_HOST_RULES: MAP ocwip.test 127.0.0.1
          E2E_IGNORE_HTTPS_ERRORS: "1"
        run: npx playwright test tests/public-pages.spec.ts
      # T-115: a critical vulnerability with a fix available fails the build.
      - name: Scan the images
        run: |
          for image in db migrate backend frontend caddy backup; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "${IMAGE_REGISTRY}ocwip-$image:$IMAGE_TAG"
          done
      - name: Push to GHCR
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          : > image-digests.env
          for image in db migrate backend frontend caddy backup; do
            docker push "${IMAGE_REGISTRY}ocwip-$image:$IMAGE_TAG"
            docker tag "${IMAGE_REGISTRY}ocwip-$image:$IMAGE_TAG" "${IMAGE_REGISTRY}ocwip-$image:${{ github.ref_name }}"
            docker push "${IMAGE_REGISTRY}ocwip-$image:${{ github.ref_name }}"
            # S-39: what a deployment of this commit pins itself to. The tag
            # can be moved to another image afterwards, the digest cannot.
            digest=$(docker image inspect --format '{{json .RepoDigests}}' "${IMAGE_REGISTRY}ocwip-$image:$IMAGE_TAG" \
              | jq -r --arg repo "${IMAGE_REGISTRY}ocwip-$image" 'map(select(startswith($repo + "@")))[0] // ""' \
              | sed 's/.*@/@/')
            echo "IMAGE_DIGEST_$(echo "$image" | tr '[:lower:]' '[:upper:]')=$digest" >> image-digests.env
          done
          # A file that is not six plain digests is useless to a deployment,
          # and it has to fail here, not three days later on the server.
          test "$(grep -cE '^IMAGE_DIGEST_[A-Z]+=@sha256:[0-9a-f]{64}$' image-digests.env)" = "6"
          test "$(wc -l < image-digests.env)" = "6"
          cat image-digests.env
      # The deployment workflow downloads this for the commit it deploys: it
      # is the whole binding between a reviewed commit and an image (S-39).
      - name: Record the digests of this commit
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.env
          # Artifacts survive a re-run of the same run, and a second upload
          # under a name already taken fails with a conflict; a missing file
          # has to fail here, not on the server three days later.
          overwrite: true
          if-no-files-found: error
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 100

  # T-114: a backup and a restore onto nothing, checked the way a person
  # would: the browser scenario on the production compose file, a backup,
  # every volume removed, scripts/restore.sh, then the same group signs in
  # and opens its attachment, application PDF and contract.
  backup:
    name: Backup and restore
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml -f docker-compose.backup-test.yml --env-file .env.prod
      E2E_COMPOSE_ARGS: -f docker-compose.prod.yml -f docker-compose.backup-test.yml --env-file .env.prod
      E2E_ADMIN_DLL: Ocwip.Api.dll
      E2E_BASE_URL: https://ocwip.test
      E2E_API_URL: https://ocwip.test/api
      E2E_IGNORE_HTTPS_ERRORS: "1"
      E2E_RUN: restore
      SMOKE_BACKEND_URL: https://ocwip.test/api
      SMOKE_FRONTEND_URL: https://ocwip.test
      SMOKE_INSECURE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: A test server with a test repository
        run: |
          echo "127.0.0.1 ocwip.test" | sudo tee -a /etc/hosts
          mkdir -p "$RUNNER_TEMP/restic-repo"
          # The backup container is root with no DAC_OVERRIDE since S-13, so
          # root there obeys the permissions of this directory like anybody
          # else and restic init would be denied on the runner's own 0755.
          chmod 0777 "$RUNNER_TEMP/restic-repo"
          cat > .env.prod <<ENV
          DOMAIN=ocwip.test
          CADDY_TLS=internal
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          MIGRATOR_PASSWORD=$(openssl rand -hex 16)
          APP_PASSWORD=$(openssl rand -hex 16)
          FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_ENABLE_SSL=false
          SMTP_FROM=ocwip@example.org
          RATE_LIMIT_PERMIT_LIMIT=200
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          RESTIC_REPOSITORY=/repository
          RESTIC_PASSWORD=$(openssl rand -hex 16)
          BACKUP_TEST_REPOSITORY=$RUNNER_TEMP/restic-repo
          ENV
      - run: $COMPOSE up -d --build
      - run: python scripts/smoke_test.py
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: The whole process on the production compose file
        working-directory: e2e
        run: npx playwright test tests/process.spec.ts
      - name: Backup, and the repository is useless without its password
        run: |
          $COMPOSE exec -T backup backup.sh
          if $COMPOSE exec -T -e RESTIC_PASSWORD=wrong backup restic snapshots; then
            echo "the repository opened with a wrong password"; exit 1
          fi
          # With sudo, because restic writes the repository as the
          # container's root with 0700 directories: a plain grep gets
          # "permission denied", exits non zero, and this check passes
          # without having read anything. Its exit code has to mean "found
          # nothing", not "could not look".
          if sudo grep -rlaF PGDMP "$RUNNER_TEMP/restic-repo"; then
            echo "the repository holds the dump in the clear"; exit 1
          fi
      - name: Restore onto nothing
        run: |
          $COMPOSE down -v
          ENV_FILE=.env.prod COMPOSE_FILES=docker-compose.backup-test.yml scripts/restore.sh
      - run: python scripts/smoke_test.py
      - name: The group, its files and its contract after the restore
        working-directory: e2e
        env:
          E2E_RESTORE_CHECK: "1"
        run: npx playwright test tests/restore-check.spec.ts
      - name: Recording of the run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-recording
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14
      - name: Container logs
        if: failure()
        run: $COMPOSE logs --tail 100

  images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The Dockerfile.prod of each side (T-110). The backend one fails its
      # own build when Europe/Warsaw is missing from the image.
      - run: docker build -f backend/Dockerfile.prod -t ocwip-backend:prod backend
      - run: docker build -f backend/Dockerfile.prod --target migrate -t ocwip-migrate:prod backend
      - run: docker build -f frontend/Dockerfile.prod -t ocwip-frontend:prod frontend
      - name: Check who the images run as
        run: |
          test "$(docker run --rm --entrypoint id ocwip-backend:prod -u)" != "0"
          test "$(docker run --rm --entrypoint id ocwip-frontend:prod -un)" = "node"
      # S-21: the field encryption key of appsettings.Development.json is in
      # the repository, and dotnet publish takes every appsettings.* along.
      # Looked for in the layers, not in the running container: a file deleted
      # after a COPY is gone from the filesystem and still in the layer, which
      # is exactly the mistake this guards against.
      - name: The development key does not travel in the production image
        run: |
          mkdir -p image && docker save ocwip-backend:prod | tar -x -C image
          found=$(find image -type f -exec tar -tf {} \; 2>/dev/null \
            | grep -c "appsettings\.Development\.json" || true)
          if [ "$found" != "0" ]; then
            echo "appsettings.Development.json is in $found layer entries of the image"; exit 1
          fi
          rm -rf image
      # The images on their own, without the development compose file: a
      # network, the database, and both containers under the names the
      # images expect. Staging, not Production, because Production refuses to
      # start without a public address and a mail relay (T-91), which is the
      # production compose file's business (T-111).
      #
      # Two roles, as on a server (T-113): ocwip_migrator runs the migrations
      # and may change the schema, ocwip_app is what the API connects as and
      # may only read and write rows.
      - name: Start the database with two roles
        run: |
          docker network create ocwip
          docker run -d --name db --network ocwip \
            -e POSTGRES_USER=ocwip -e POSTGRES_PASSWORD=ocwip -e POSTGRES_DB=ocwip \
            -e POSTGRES_INITDB_ARGS=--locale=C.UTF-8 \
            -v "$PWD/db/init:/docker-entrypoint-initdb.d:ro" postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U ocwip -d ocwip && break; sleep 2; done
          # initdb restarts the server once after the init scripts; wait for that too.
          sleep 5
          for i in $(seq 1 30); do docker exec db pg_isready -U ocwip -d ocwip && break; sleep 2; done
          docker exec db psql -U ocwip -d ocwip -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ocwip_migrator LOGIN PASSWORD 'migrator'" \
            -c "CREATE ROLE ocwip_app LOGIN PASSWORD 'app'" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO ocwip_migrator"
      - name: Migrate as the schema role
        run: |
          docker run --rm --network ocwip \
            -e "ConnectionStrings__Postgres=Host=db;Port=5432;Database=ocwip;Username=ocwip_migrator;Password=migrator" \
            ocwip-migrate:prod
      - name: The API's role may not change the schema
        run: |
          if docker exec db psql -U ocwip_app -d ocwip -v ON_ERROR_STOP=1 -c "CREATE TABLE ddl_probe (id int)"; then
            echo "ocwip_app was allowed to create a table"; exit 1
          fi
          if docker exec db psql -U ocwip_app -d ocwip -v ON_ERROR_STOP=1 -c "ALTER TABLE users ADD COLUMN probe int"; then
            echo "ocwip_app was allowed to alter a table"; exit 1
          fi
      # S-09: the trail of what happened is the one thing the application's
      # own connection must not be able to rewrite. Retention (AGENTS.md 5)
      # stood on the discipline of the code alone until NarrowAppRoleGrants.
      - name: The API's role may not erase the trail
        run: |
          for table in personal_data_reads application_status_history report_status_history \
                       application_versions report_versions consent_acceptances; do
            for verb in DELETE UPDATE; do
              allowed=$(docker exec db psql -U ocwip -d ocwip -tA \
                -c "SELECT has_table_privilege('ocwip_app', '$table', '$verb')")
              if [ "$allowed" != "f" ]; then
                echo "ocwip_app may $verb $table"; exit 1
              fi
            done
            for verb in SELECT INSERT; do
              allowed=$(docker exec db psql -U ocwip -d ocwip -tA \
                -c "SELECT has_table_privilege('ocwip_app', '$table', '$verb')")
              if [ "$allowed" != "t" ]; then
                echo "ocwip_app may not $verb $table, which it has to"; exit 1
              fi
            done
          done
          # The ciphertext of a kept version is the one exception: a key
          # rotation rewrites it through this same connection, column by
          # column, while the trail around it stays frozen.
          for pair in "application_versions:answers:t" "application_versions:entity_snapshot:t" \
                      "application_versions:checksum:f" "application_versions:version_number:f" \
                      "application_versions:submitted_at:f" "report_versions:answers:t" \
                      "report_versions:prefill:t" "report_versions:cost_review:f" \
                      "report_versions:submitted_at:f"; do
            table=${pair%%:*}; rest=${pair#*:}; column=${rest%%:*}; want=${rest#*:}
            allowed=$(docker exec db psql -U ocwip -d ocwip -tA \
              -c "SELECT has_column_privilege('ocwip_app', '$table', '$column', 'UPDATE')")
            if [ "$allowed" != "$want" ]; then
              echo "ocwip_app UPDATE on $table.$column is $allowed, wanted $want"; exit 1
            fi
          done
          # And nowhere else either: the product deletes no row at all.
          deletable=$(docker exec db psql -U ocwip -d ocwip -tA -c \
            "SELECT count(*) FROM information_schema.tables t
             WHERE t.table_schema = 'public' AND t.table_type = 'BASE TABLE'
               AND has_table_privilege('ocwip_app', format('%I.%I', t.table_schema, t.table_name), 'DELETE')")
          if [ "$deletable" != "0" ]; then
            echo "ocwip_app may DELETE from $deletable tables"; exit 1
          fi
      - name: Start the API and the frontend
        run: |
          # Restarted if it starts before the database accepts connections.
          # A field encryption key made for this run only (T-47a).
          docker run -d --name backend --network ocwip -p 8080:8080 --restart on-failure:5 \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e "FieldEncryption__Keys__1=$(openssl rand -base64 32)" \
            -e "ConnectionStrings__Postgres=Host=db;Port=5432;Database=ocwip;Username=ocwip_app;Password=app" \
            ocwip-backend:prod
          docker run -d --name frontend --network ocwip -p 3000:3000 ocwip-frontend:prod
      - run: python scripts/smoke_test.py
      # T-104: the team's account commands in the runtime image, without the
      # SDK, against the database the API uses. An unknown address must fail
      # with exit code 1, which proves the command ran and reached the data.
      - name: Account commands in the runtime image
        run: |
          docker exec backend dotnet Ocwip.Api.dll list-accounts
          for command in "grant-role --email nikt@example.org --role Operator" "deactivate-account --email nikt@example.org" "reactivate-account --email nikt@example.org"; do
            set +e
            output=$(docker exec backend dotnet Ocwip.Api.dll $command 2>&1)
            code=$?
            set -e
            echo "$output"
            if [ "$code" -ne 1 ] || ! echo "$output" | grep -q "nikt@example.org"; then
              echo "expected a refusal naming the address, got exit $code"; exit 1
            fi
          done
      - name: Container logs
        if: failure()
        run: |
          docker logs --tail 100 backend
          docker logs --tail 100 frontend
