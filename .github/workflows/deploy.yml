name: Deploy

# T-115: a deployment is started by a person, on purpose, for one commit
# whose images are already in GHCR (ci.yml, job production, on dev and main).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: The commit (full SHA) whose images to deploy
        type: string
        required: true
      force:
        description: Deploy although an open intake closes within 3 days
        type: boolean
        default: false

# One deployment per environment at a time.
concurrency: deploy-${{ inputs.environment }}

permissions:
  contents: read
  # The image digests of the commit being deployed are a CI artifact (S-39).
  actions: read

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # The environment holds the approval (required reviewers), the address
    # and the deploy key; an administrator sets them up (docs/wdrozenie.md).
    environment: ${{ inputs.environment }}
    steps:
      # The input goes to the shell through the environment, and only as a
      # full commit SHA: typed text never becomes a command.
      - name: The commit is a full SHA
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "tag has to be a full 40 character commit SHA"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      # Before anything from that commit runs: only reviewed code goes out,
      # merged to main (production), or to dev or main (staging). The
      # environments' "deployment branches" guard the workflow file itself
      # (docs/wdrozenie.md).
      - name: The commit is merged
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.environment }}
        run: |
          branches=(origin/main)
          [ "$TARGET" = staging ] && branches+=(origin/dev)
          for branch in "${branches[@]}"; do
            git merge-base --is-ancestor "$TAG" "$branch" && { echo "$TAG is on $branch."; exit 0; }
          done
          echo "$TAG is not merged to ${branches[*]}: only merged commits are deployed to $TARGET."
          exit 1
      # S-39: the digests CI recorded when it pushed the images of this
      # commit. A tag in GHCR can be moved to another image; the digest of
      # the image that went through the scan and the smoke test cannot, and
      # this file is the only thing binding one to the other.
      - name: The image digests of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TAG&event=push&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "dev" or .head_branch == "main")] | sort_by(.run_started_at) | last | .id')
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "No successful CI run on dev or main for $TAG, so no digests to deploy by."
            echo "docs/wdrozenie.md, \"Wdrożenie po digeście obrazu\", says how to get them back."
            exit 1
          fi
          gh run download "$run" -n "image-digests-$TAG" -D digests
          # Six services, six plain digests, nothing else: this file is piped
          # to a script running on the server.
          test "$(grep -cE '^IMAGE_DIGEST_[A-Z]+=@sha256:[0-9a-f]{64}$' digests/image-digests.env)" = "6"
          test "$(wc -l < digests/image-digests.env)" = "6"
          cat digests/image-digests.env
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # SITE_BASIC_AUTH (user:password) only where the site has a password,
      # staging (T-117); production has none and leaves it empty.
      - name: Calendar lock
        env:
          SITE_BASIC_AUTH: ${{ secrets.SITE_BASIC_AUTH }}
        run: python scripts/deploy_guard.py "https://${{ vars.DOMAIN }}/api" ${{ inputs.force && '--force' || '' }}
      - name: Deploy over SSH
        env:
          TAG: ${{ inputs.tag }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The digests go in on standard input: deploy.sh keeps them for
          # this commit and pins every image to them. The command line still
          # carries the commit, so a key with restrict,command= (S-11) reads
          # it out of SSH_ORIGINAL_COMMAND and runs nothing the client asks.
          ssh -i ~/.ssh/deploy "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${{ vars.DEPLOY_PATH }}' && scripts/deploy.sh $TAG" < digests/image-digests.env
      - name: The public address answers
        env:
          SITE_BASIC_AUTH: ${{ secrets.SITE_BASIC_AUTH }}
        run: |
          auth=(); [ -n "$SITE_BASIC_AUTH" ] && auth=(-u "$SITE_BASIC_AUTH")
          curl -sf "${auth[@]}" "https://${{ vars.DOMAIN }}/api/health/db"
          curl -sf "${auth[@]}" -o /dev/null "https://${{ vars.DOMAIN }}/"
