# The OCWIP demo behind Apache on a shared server (docker-compose.behind-proxy.yml).
# Its own file in sites-available: nothing else on the server is touched.
# Apache is the door; the stack listens on the loopback only.
#
#   /            the whole site, the API included   password (portal)    noindex
#   /mailpit/    the mailbox                         password (mailbox)   noindex
#   /robots.txt  open, disallows everything
#
# Placeholders: demoocwip.n02b3rt.pl, the loopback port 18090 and the paths
# under /srv/ocwip-demo and /etc/apache2. docs/wdrozenie.md, "Demo za serwerem
# hosta", has the order: the :80 block and certbot first, then this whole file.

<VirtualHost *:80>
    ServerName demoocwip.n02b3rt.pl

    # Let's Encrypt's challenge, then everything else goes to HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Require all granted
        Options -Indexes
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/ocwip_demo_error.log
    CustomLog ${APACHE_LOG_DIR}/ocwip_demo_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName demoocwip.n02b3rt.pl

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/demoocwip.n02b3rt.pl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/demoocwip.n02b3rt.pl/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/ocwip_demo_error.log
    CustomLog ${APACHE_LOG_DIR}/ocwip_demo_access.log combined

    # On every answer, the password's 401 included.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"

    # The address the API counts sign in attempts by is the one Apache saw,
    # never one a visitor wrote into a header: Caddy behind takes the
    # rightmost entry, which is the one mod_proxy adds after this unset.
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"

    # The largest attachment plus the envelope, as in Caddy and Kestrel.
    LimitRequestBody 27262976

    # robots.txt: said outside every password, so a crawler can read it.
    Alias /robots.txt /srv/ocwip-demo/web/robots.txt
    <Directory /srv/ocwip-demo/web>
        Require all granted
        Options -Indexes
    </Directory>

    # The whole site behind the portal's password, the API with it: the
    # application signs in with its own cookie and never needs the header.
    <Location "/">
        AuthType Basic
        AuthName "OCWIP demo - dostep tylko dla zespolu i klienta"
        AuthUserFile /etc/apache2/.htpasswd-ocwip-demo
        Require valid-user
    </Location>
    <Location "/robots.txt">
        Require all granted
    </Location>

    # The mailbox, behind a password of its own: every message in it is a
    # working link into somebody's account. Any case and with or without the
    # slash, because Caddy behind matches paths without regard to case, so
    # "/MAILPIT/" must not get by with the portal's password alone.
    <LocationMatch "(?i)^/+mailpit">
        AuthType Basic
        AuthName "OCWIP demo - skrzynka"
        AuthUserFile /etc/apache2/.htpasswd-ocwip-mailpit
        Require valid-user
    </LocationMatch>

    # The password stops here; nothing behind Apache ever sees it.
    RequestHeader unset Authorization

    # Mailpit keeps a websocket open for new messages.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/mailpit/(.*)$ ws://127.0.0.1:18090/mailpit/$1 [P,L,NC]

    ProxyPass        /robots.txt !
    ProxyPass        / http://127.0.0.1:18090/ timeout=120 keepalive=On
    ProxyPassReverse / http://127.0.0.1:18090/
</VirtualHost>
</IfModule>
